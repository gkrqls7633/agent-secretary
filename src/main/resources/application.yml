spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:sqlite:db/agent_secretary.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true

slack:
  bot-token: ${SLACK_BOT_TOKEN}
  signing-secret: ${SLACK_SIGNING_SECRET}
  app-token: ${SLACK_APP_TOKEN}
  channel-id: ${SLACK_CHANNEL_ID}

google:
  calendar:
    credentials-path: ${GOOGLE_CREDENTIALS_PATH}
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
  tasks:
    task-list-id: ${GOOGLE_TASKS_LIST_ID:@default}
    client-secret-path: ${GOOGLE_TASKS_CLIENT_SECRET_PATH:client_secret.json}
    tokens-path: ${GOOGLE_TASKS_TOKENS_PATH:tokens}
